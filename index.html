<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Visualisasi GeoTIFF - Diperbaiki</title>
    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #222; color: white; text-align: center; padding: 10px; }
        .card { max-width: 1000px; margin: auto; background: #333; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        select { padding: 10px; border-radius: 6px; background: #555; color: white; margin-bottom: 20px; font-size: 16px; cursor: pointer; }
        .canvas-container { max-width: 100%; max-height: 80vh; overflow: auto; border: 2px solid #666; margin-top: 10px; background: black;}
        canvas { display: block; margin: auto; max-width: 100%; height: auto; }
        .info { margin-top: 10px; color: #ccc; font-size: 0.9em; font-style: italic; }
        
        /* Style Legenda Sesuai Permintaan (Hitam & Putih) */
        .legend-container { display: flex; align-items: center; justify-content: center; margin: 20px 0; gap: 30px; font-weight: bold;}
        .legend-item { display: flex; align-items: center; gap: 10px; }
        .legend-box { width: 25px; height: 25px; border-radius: 4px; border: 1px solid #fff; }
        
        /* Style Wadah Grafik */
        .chart-container { margin-top: 30px; background: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #555; }
    </style>
</head>
<body>

<div class="card">
    <h3>Data Tutupan Lahan Sawit Tahunan (.tif)</h3>
    
    <select id="yearSelect" onchange="loadAndFixTiff()">
        <option value="2023.tif">2023</option>
        <option value="2024.tif">2024</option>
        <option value="2025.tif">2025</option>
    </select>

    <div class="canvas-container">
        <canvas id="tiffCanvas"></canvas>
    </div>
    
    <div id="legendContainer" class="legend-container" style="display: none;">
        <div class="legend-item">
            <div class="legend-box" style="background-color: black; border-color: #666;"></div>
            <span>Tutupan Lahan Sawit</span>
        </div>
        <div class="legend-item">
            <div class="legend-box" style="background-color: white; border-color: #ccc;"></div>
            <span>Bukan Tutupan Lahan Sawit</span>
        </div>
    </div>

    <div id="status" class="info">Memuat data...</div>

    <div class="chart-container" id="chartWrapper" style="display: none;">
        <h4>Grafik Luas Lahan</h4>
        <div style="max-width: 500px; margin: auto;">
            <canvas id="areaChart"></canvas>
        </div>
    </div>
</div>

<script>
    let chartInstance = null; // Menyimpan instance chart agar bisa di-reset saat ganti tahun

    async function loadAndFixTiff() {
        const fileName = document.getElementById('yearSelect').value;
        const canvas = document.getElementById('tiffCanvas');
        const status = document.getElementById('status');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Reset komponen UI sebelum memuat data baru
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('legendContainer').style.display = 'none';
        document.getElementById('chartWrapper').style.display = 'none';
        status.innerHTML = `Membaca ${fileName}...`;

        try {
            const response = await fetch(fileName);
            if (!response.ok) throw new Error("Gagal mengunduh file.");
            
            const arrayBuffer = await response.arrayBuffer();
            const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
            const image = await tiff.getImage();
            
            const width = image.getWidth();
            const height = image.getHeight();
            
            // Baca data raster mentah
            const rasterData = await image.readRasters({ pool: new GeoTIFF.Pool() });
            
            status.innerHTML = `Resolusi: ${width}x${height}px. Menormalisasi data...`;

            canvas.width = width;
            canvas.height = height;
            const imageData = ctx.createImageData(width, height);
            
            const band0 = rasterData[0];
            
            // 1. Cari nilai Max mentah untuk pembagian skala otomatis
            let maxVal = 0;
            for (let i = 0; i < band0.length; i++) {
                if (band0[i] > maxVal) maxVal = band0[i];
            }

            if (maxVal < 255) maxVal = 255; 

            // Variabel counter untuk menghitung luas lahan berdasarkan klasifikasi warna
            let countSawit = 0;
            let countBukanSawit = 0;

            // 2. Normalisasi, Rendering Canvas, & Perhitungan Luas
            for (let i = 0, j = 0; i < band0.length; i++, j += 4) {
                let scaledVal = Math.round((band0[i] / maxVal) * 255);
                
                if (scaledVal > 255) scaledVal = 255;
                if (scaledVal < 0 || isNaN(scaledVal)) scaledVal = 0;

                // Hitung klasifikasi (Sesuai logika: 0/Hitam = Sawit, selain itu/Putih = Bukan)
                if (scaledVal === 0) {
                    countSawit++;
                } else {
                    countBukanSawit++;
                }

                imageData.data[j]     = scaledVal; // R
                imageData.data[j + 1] = scaledVal; // G
                imageData.data[j + 2] = scaledVal; // B
                imageData.data[j + 3] = 255;       // Alpha
            }

            ctx.putImageData(imageData, 0, 0);
            
            // 3. Konversi Spasial Otomatis ke Hektar (Jika GeoTIFF memiliki metadata koordinat meter)
            let areaFactor = 1;
            let unitLabel = "Piksel";
            try {
                const res = image.getResolution();
                if (res && Math.abs(res[0]) > 0.1) {
                    // Jika resolusi spasial terdeteksi (misal resolusi 10m atau 30m)
                    // Rumus: (Jumlah Piksel * (ResX * ResY)) / 10.000 untuk mengubah ke Hektar (ha)
                    areaFactor = Math.abs(res[0] * res[1]) / 10000; 
                    unitLabel = "Hektar (ha)";
                }
            } catch (e) {
                console.log("Metadata resolusi tidak ditemukan, default menggunakan perhitungan piksel.");
            }

            const nilaiSawit = (countSawit * areaFactor).toFixed(2);
            const nilaiBukanSawit = (countBukanSawit * areaFactor).toFixed(2);

            // 4. Tampilkan Legenda
            document.getElementById('legendContainer').style.display = 'flex';

            // 5. Render Grafik Luas Lahan
            renderChart(fileName, nilaiSawit, nilaiBukanSawit, unitLabel);

            status.innerHTML = `Selesai memuat ${fileName}. Luas Lahan Sawit: ${nilaiSawit} ${unitLabel}`;

        } catch (err) {
            console.error(err);
            status.innerHTML = `<span style="color:red">Error: ${err.message}</span>`;
        }
    }

    // Fungsi menggambar grafik balok (Bar Chart) perbandingan luas lahan
    function renderChart(title, dataSawit, dataBukanSawit, unit) {
        document.getElementById('chartWrapper').style.display = 'block';
        const ctxChart = document.getElementById('areaChart').getContext('2d');
        
        // Hancurkan chart lama jika ada agar tidak tumpang tindih saat ganti dropdown tahun
        if (chartInstance) {
            chartInstance.destroy();
        }

        chartInstance = new Chart(ctxChart, {
            type: 'bar',
            data: {
                labels: ['Tutupan Lahan Sawit', 'Bukan Tutupan Lahan Sawit'],
                datasets: [{
                    label: `Luas Lahan (${unit}) - Tahun ${title.replace('.tif', '')}`,
                    data: [dataSawit, dataBukanSawit],
                    backgroundColor: [
                        'rgba(0, 0, 0, 0.85)',       // Balok hitam untuk Sawit
                        'rgba(255, 255, 255, 0.85)'  // Balok putih untuk Bukan Sawit
                    ],
                    borderColor: [
                        'rgba(255, 255, 255, 0.5)',  // Border putih tipis agar balok hitam terlihat di dark mode
                        'rgba(0, 0, 0, 0.5)'
                    ],
                    borderWidth: 15
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: `Luas (${unit})`, color: '#ccc' },
                        ticks: { color: '#ccc' }
                    },
                    x: {
                        ticks: { color: '#ccc' }
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#fff' }
                    }
                }
            }
        });
    }

    // Jalankan saat load awal halaman
    window.onload = loadAndFixTiff;
</script>

</body>
</html>
